name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon + BPF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # bpf2go needs clang to compile bpf/shooter.bpf.c and llvm-strip to strip
      # the object. The libbpf headers are vendored in bpf/headers.
      - name: Install clang/llvm
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang llvm
          clang --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The generated bindings and the BPF object are committed, so a change to
      # the C program arrives as a reviewable diff. This catches a .bpf.c edit
      # whose regenerated object nobody committed. The object is byte-for-byte
      # reproducible with the same clang major, so runs-on is pinned to
      # ubuntu-24.04 (clang 18); bump both together.
      - name: BPF object is up to date
        run: |
          go generate ./internal/bpfobj/
          git diff --exit-code -- internal/bpfobj/ \
            || { echo "::error::internal/bpfobj is stale: run 'make generate' and commit the result"; exit 1; }
      - name: Vet
        run: go vet ./...
      # The verifier and BPF_PROG_TEST_RUN tests need root and skip themselves
      # here; run them locally with 'make test-bpf'.
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o flowbreaker ./cmd/flowbreaker

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No build step and no package.json: the game is plain ES modules, so a
      # parse check of every module is the whole gate. Vendored three.js is skipped.
      - name: Syntax-check ES modules
        run: |
          for f in web/js/*.js; do
            node --experimental-default-type=module --check "$f" || exit 1
          done

  godot:
    name: Godot client
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip && mv Godot_v* godot
      # Headless run against the built-in demo traffic: packets must spawn and
      # at least one flow must get blocked. Any script error fails the job too.
      - name: Smoke test
        run: |
          ~/godot/godot --headless --path godot --import > import.log 2>&1 || true
          ~/godot/godot --headless --path godot -- --demo --selftest 2>&1 | tee run.log
          grep -q "SELFTEST OK" run.log
          if grep -h "SCRIPT ERROR" import.log run.log; then exit 1; fi
